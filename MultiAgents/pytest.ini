; Конфигурация pytest для этого репозитория.
; testpaths ограничивает сбор тестов папкой tests. Без этого pytest подхватывает
; корневые скрипты test_speed.py и test_cude.py: они при импорте сразу стучатся
; в локальную Ollama и в nvidia-smi, то есть висят/падают без оборудования.
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
